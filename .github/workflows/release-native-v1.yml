name: Release native v1.0.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-native-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-native-v1
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Compile WPF native application
        shell: pwsh
        run: dotnet build native/CodexExtensionFixer/CodexExtensionFixer.csproj -c Release
      - name: Run isolated repair and restore tests
        shell: pwsh
        run: dotnet run --project tests/NativeTests/NativeTests.csproj -c Release
      - name: Publish self-contained Windows x64 binary
        shell: pwsh
        run: dotnet publish native/CodexExtensionFixer/CodexExtensionFixer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist/native
      - name: Verify EXE and create checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'dist/native/Codex-Extension-Fixer.exe'
          if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw 'Executable is missing' }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $path))
          if ($bytes.Length -lt 4096 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Invalid PE executable' }
          $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          $line = "$hash  Codex-Extension-Fixer.exe" + "`n"
          [System.IO.File]::WriteAllText((Join-Path $PWD 'dist/native/Codex-Extension-Fixer.exe.sha256'), $line, (New-Object System.Text.UTF8Encoding($false)))
          if (!(Test-Path 'docs/release-notes-v1.0.0.md')) { throw 'Release notes missing' }
          Write-Host "SHA256: $hash"
      - name: Smoke-test native window
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'dist/native/Codex-Extension-Fixer.exe').Path
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 7
            $process.Refresh()
            if ($process.HasExited) { throw "GUI exited unexpectedly ($($process.ExitCode))" }
          }
          finally {
            $process.Refresh()
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Create permanent v1.0.0 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view v1.0.0 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'Release v1.0.0 already exists; refusing to replace published assets.' }
          gh release create v1.0.0 dist/native/Codex-Extension-Fixer.exe dist/native/Codex-Extension-Fixer.exe.sha256 --target "$env:GITHUB_SHA" --title 'Codex Extension Fixer v1.0.0 — Liquid Glass' --notes-file docs/release-notes-v1.0.0.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release command failed.' }
      - name: Upload build for CI traceability
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Extension-Fixer-v1.0.0-Win-x64
          path: |
            dist/native/Codex-Extension-Fixer.exe
            dist/native/Codex-Extension-Fixer.exe.sha256
          if-no-files-found: error
